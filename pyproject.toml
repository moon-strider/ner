[project]
name = "ner-service"
version = "1.0"
description = "NER HTTP service backed by LLMs with strict JSON Schema structured output, supporting multiple providers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.0",
    "httpx==0.28.1",
    "prometheus-fastapi-instrumentator==7.1.0",
    "stdlib-list==0.12.0",
    "aiosqlite==0.22.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp-proto-http==1.41.1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-httpx==0.36.0",
    "ruff==0.15.12",
    "mypy==2.0.0",
    "datasets==4.8.5",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ner_service"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "opentelemetry",
    "opentelemetry.exporter.*",
    "opentelemetry.instrumentation.*",
    "opentelemetry.sdk.*",
    "aiosqlite",
    "ahocorasick",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live tests against real provider; require API key",
]

[dependency-groups]
dev = [
    "openapi-python-client==0.28.3",
    "pyahocorasick==2.3.1",
]
