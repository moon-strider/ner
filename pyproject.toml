[project]
name = "ner-service"
version = "1.1.0"
description = "NER HTTP service backed by LLMs with strict JSON Schema structured output, supporting multiple providers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "prometheus-fastapi-instrumentator==8.1.0",
    "aiosqlite==0.22.1",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-httpx==0.36.2",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest-cov==7.1.0",
    "openapi-python-client==0.29.1",
]

benchmark = ["datasets==5.0.1"]

[project.urls]
Repository = "https://github.com/moon-strider/ner"
Issues = "https://github.com/moon-strider/ner/issues"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ner_service"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "opentelemetry",
    "opentelemetry.exporter.*",
    "opentelemetry.instrumentation.*",
    "opentelemetry.sdk.*",
    "aiosqlite",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: opt-in tests against a live provider",
]
