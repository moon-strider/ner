[project]
name = "ner-service"
version = "1.0"
description = "NER HTTP service backed by LLMs with strict JSON Schema structured output, supporting multiple providers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "stdlib-list>=0.12.0",
    "aiosqlite==0.22.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp-proto-http==1.41.1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "ruff",
    "mypy",
    "datasets",
]
cerebras = ["cerebras-cloud-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ner_service"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "cerebras.*",
    "opentelemetry",
    "opentelemetry.exporter.*",
    "opentelemetry.instrumentation.*",
    "opentelemetry.sdk.*",
    "aiosqlite",
    "ahocorasick",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live tests against real provider; require API key",
]

[dependency-groups]
dev = [
    "openapi-python-client==0.28.3",
    "pyahocorasick>=2.3.1",
]
